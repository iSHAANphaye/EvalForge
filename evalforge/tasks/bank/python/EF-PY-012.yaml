prompt: "# Raft Log Compaction Buffer with Index Offsets\n\nImplement a replicated log buffer for the Raft distributed consensus\
  \ protocol that supports log compaction (snapshotting) with 1-based logical index offset mapping.\n\n## Requirements\n\n\
  Implement the dataclass `LogEntry`:\n- `index: int`: 1-based monotonic log index.\n- `term: int`: Election term during which\
  \ the entry was proposed.\n- `command: Any`: Arbitrary state-machine payload.\n\nImplement the class `RaftLogBuffer`:\n\n\
  - `__init__(self, initial_snapshot_index: int = 0, initial_snapshot_term: int = 0)`:\n  Initializes log buffer with the\
  \ last included snapshot index and term.\n- `append(self, term: int, command: Any) -> LogEntry`:\n  Appends a new entry\
  \ with `index = self.last_index() + 1` and returns the created `LogEntry`.\n- `truncate_after(self, index: int) -> None`:\n\
  \  Removes all entries with `entry.index > index` to handle leader conflict resolution.\n- `compact(self, snapshot_index:\
  \ int, snapshot_term: int) -> bool`:\n  Discards all buffered entries up to and including `snapshot_index`. Updates `last_included_index`\
  \ and `last_included_term`.\n  Returns `True` if compaction was applied, or `False` if `snapshot_index <= last_included_index`.\n\
  - `get_entry(self, index: int) -> LogEntry | None`:\n  Returns the entry at logical `index`. Returns `None` if `index <=\
  \ last_included_index` (already compacted) or `index > last_index()`.\n- `get_entries_from(self, index: int) -> list[LogEntry]`:\n\
  \  Returns all buffered entries from logical `index` onward. Returns empty list if `index > last_index()`.\n  Raises `ValueError`\
  \ if `index <= last_included_index` (compacted data requested).\n- `last_index(self) -> int`:\n  Returns the highest index\
  \ stored in log or snapshot.\n- `last_term(self) -> int`:\n  Returns the term associated with `last_index()`.\n- `first_available_index(self)\
  \ -> int`:\n  Returns `last_included_index + 1`.\n"
