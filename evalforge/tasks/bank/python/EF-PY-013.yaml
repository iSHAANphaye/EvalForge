prompt: "# Bellman-Ford Shortest Path with Negative Cycle Detection\n\nImplement the Bellman-Ford algorithm on directed weighted\
  \ graphs supporting arbitrary real-valued weights, detecting reachable negative-weight cycles, and reconstructing negative\
  \ cycle paths.\n\n## Requirements\n\nImplement the class `BellmanFordGraph`:\n\n- `__init__(self, vertices: list[Any] |\
  \ None = None)`:\n  Initializes graph with optional vertex list.\n- `add_edge(self, u: Any, v: Any, weight: float) -> None`:\n\
  \  Adds a directed edge from `u` to `v` with given real weight. Adds vertices if not already present.\n- `shortest_paths(self,\
  \ source: Any) -> tuple[dict[Any, float], dict[Any, list[Any]]]`:\n  Computes shortest paths from `source` to all reachable\
  \ vertices.\n  Returns `(distances, paths)` where:\n  - `distances`: mapping from vertex to minimum distance (`float('inf')`\
  \ if unreachable).\n  - `paths`: mapping from vertex to the ordered list of vertices along the shortest path from `source`\
  \ to that vertex (empty list for unreachable vertices, `[source]` for source itself).\n  - If a negative-weight cycle is\
  \ reachable from `source`, raises `ValueError(\"Negative weight cycle detected\")`.\n- `find_negative_cycle(self) -> list[Any]\
  \ | None`:\n  Finds any negative-weight cycle present anywhere in the graph.\n  Returns the cycle as a list of vertices\
  \ `[v1, v2, ..., vk, v1]` where the first and last vertex match, or `None` if no negative cycle exists.\n"
