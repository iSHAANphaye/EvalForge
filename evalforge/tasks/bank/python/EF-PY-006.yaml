prompt: "# Disjoint Set Union with Path Compression and Rank\n\nImplement a generic Disjoint Set Union (DSU / Union-Find)\
  \ data structure supporting near-constant time amortized operations using path compression and union by rank.\n\n## Requirements\n\
  \nImplement the class `DisjointSet`:\n\n- `make_set(self, x: Any) -> None`:\n  Adds a new element `x` as an independent\
  \ set of size 1. If `x` already exists, does nothing.\n- `find(self, x: Any) -> Any`:\n  Finds the representative (root)\
  \ of the set containing `x`, applying two-pass or recursive path compression.\n  Raises `KeyError` if `x` has not been added\
  \ via `make_set`.\n- `union(self, x: Any, y: Any) -> bool`:\n  Unites the sets containing elements `x` and `y` using union\
  \ by rank.\n  If the root ranks are equal, increments the rank of the new root.\n  Updates the component size accordingly.\n\
  \  Returns `True` if two disjoint sets were united, or `False` if `x` and `y` were already in the same set.\n  Raises `KeyError`\
  \ if either `x` or `y` is not registered.\n- `connected(self, x: Any, y: Any) -> bool`:\n  Returns `True` if `x` and `y`\
  \ share the same representative, `False` otherwise.\n  Raises `KeyError` if either element is not registered.\n- `get_component_size(self,\
  \ x: Any) -> int`:\n  Returns the total number of elements in the component containing `x`.\n- `count_components(self) ->\
  \ int`:\n  Returns the total number of distinct disjoint sets (connected components).\n"
