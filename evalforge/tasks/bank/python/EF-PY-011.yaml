prompt: "# Sliding-Window TCP Packet Reassembly Buffer\n\nImplement a TCP packet reassembly buffer that simulates the transport\
  \ layer's receive window. It handles out-of-order, overlapping, duplicate, and fragmented byte segments.\n\n## Requirements\n\
  \nImplement the class `PacketReassemblyBuffer`:\n\n- `__init__(self, initial_seq: int = 0, window_size: int = 65535)`:\n\
  \  Initializes reassembly buffer with the initial expected byte sequence number (`initial_seq >= 0`) and sliding window\
  \ capacity (`window_size >= 1`).\n- `receive_segment(self, seq: int, data: bytes) -> bytes`:\n  Processes an incoming segment\
  \ starting at byte sequence number `seq`.\n  - Discards any data falling entirely before `expected_seq` or completely beyond\
  \ the current window boundary `[expected_seq, expected_seq + window_size)`.\n  - Trims overlapping slices that are already\
  \ received or buffered.\n  - If the segment fills the contiguous gap starting at `expected_seq`, returns all newly contiguous\
  \ in-order bytes and advances `expected_seq`.\n  - Otherwise, stores the out-of-order fragment in the buffer and returns\
  \ `b\"\"`.\n- `expected_seq(self) -> int`:\n  Returns the current next expected byte sequence number.\n- `buffered_bytes_count(self)\
  \ -> int`:\n  Returns the total count of non-overlapping buffered bytes waiting for preceding gaps to be filled.\n- `is_empty(self)\
  \ -> bool`:\n  Returns `True` if no out-of-order segments are currently buffered, `False` otherwise.\n"
