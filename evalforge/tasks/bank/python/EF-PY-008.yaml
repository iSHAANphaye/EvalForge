prompt: "# Streaming JSON Tokenizer State Machine\n\nImplement an incremental streaming JSON lexer / tokenizer state machine\
  \ that consumes incoming text chunks of arbitrary length and produces complete tokens without buffering the entire payload\
  \ in memory.\n\n## Requirements\n\nImplement the enum `TokenType`:\n- `LEFT_BRACE`: `{`\n- `RIGHT_BRACE`: `}`\n- `LEFT_BRACKET`:\
  \ `[`\n- `RIGHT_BRACKET`: `]`\n- `COLON`: `:`\n- `COMMA`: `,`\n- `STRING`: String value with escapes unescaped (e.g. `\"\
  hello\"`)\n- `NUMBER`: Integer or floating-point value (e.g. `42`, `-3.14`)\n- `BOOLEAN`: Boolean value (`True` or `False`)\n\
  - `NULL`: `None`\n\nImplement the dataclass `Token`:\n- `type: TokenType`\n- `value: Any`\n\nImplement `StreamingJSONTokenizer`:\n\
  - `feed(self, chunk: str) -> list[Token]`:\n  Feeds an arbitrary string fragment. Returns a list of all tokens completed\
  \ by this chunk. Tokens split across boundaries must remain buffered until finished.\n- `finish(self) -> list[Token]`:\n\
  \  Signals end-of-input. Flushes any remaining terminal tokens (such as trailing numbers or literals).\n  Raises `ValueError`\
  \ if stream ends inside an unfinished string, escape sequence, or malformed literal.\n"
