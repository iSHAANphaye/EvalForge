prompt: "# SQL WHERE Clause Boolean AST Evaluator\n\nImplement a parser and evaluator for SQL `WHERE` clause boolean expressions\
  \ against dictionary rows.\n\n## Supported Operations\n\n1. **Logical operators**: `AND`, `OR`, `NOT` (Precedence: `NOT`\
  \ > `AND` > `OR`, overridden by parentheses `()`).\n2. **Comparison operators**: `=`, `!=`, `>`, `<`, `>=`, `<=` (supporting\
  \ numbers and strings).\n3. **Set inclusion**: `field IN (val1, val2, ...)`\n4. **Pattern matching**: `field LIKE 'pattern'`\
  \ where `'%'` matches zero or more characters.\n\n## Requirements\n\nImplement the class `WhereClauseEvaluator`:\n\n- `parse_and_eval(self,\
  \ expr_str: str, row: dict[str, Any]) -> bool`:\n  Tokenizes, parses, and evaluates the SQL WHERE clause string `expr_str`\
  \ against `row`.\n  Returns `True` if `row` satisfies the predicate, `False` otherwise.\n  If a referenced field is missing\
  \ from `row`, its value is treated as `None`. Comparisons with `None` (other than `=` and `!=`) evaluate to `False`.\n-\
  \ `evaluate_ast(self, ast_node: dict[str, Any], row: dict[str, Any]) -> bool`:\n  Evaluates a structured dictionary AST\
  \ node directly against `row`.\n  AST format:\n  - `{\"op\": \"AND\", \"left\": <node>, \"right\": <node>}`\n  - `{\"op\"\
  : \"OR\", \"left\": <node>, \"right\": <node>}`\n  - `{\"op\": \"NOT\", \"expr\": <node>}`\n  - `{\"op\": \"=\", \"field\"\
  : \"age\", \"val\": 25}` (or `!=`, `>`, `<`, `>=`, `<=`, `IN`, `LIKE`)\n"
starter_code: "from typing import Any\n\n\nclass WhereClauseEvaluator:\n    def __init__(self) -> None:\n        \"\"\"Initialize\
  \ SQL Where Clause Evaluator.\"\"\"\n        pass\n\n    def parse_and_eval(self, expr_str: str, row: dict[str, Any]) ->\
  \ bool:\n        \"\"\"Parse WHERE clause string and evaluate against row dictionary.\"\"\"\n        pass\n\n    def evaluate_ast(self,\
  \ ast_node: dict[str, Any], row: dict[str, Any]) -> bool:\n        \"\"\"Evaluate pre-parsed AST node against row dictionary.\"\
  \"\"\n        pass\n"
canonical_solution: "import re\nfrom typing import Any\n\n\nclass WhereClauseEvaluator:\n    def evaluate_ast(self, ast_node:\
  \ dict[str, Any], row: dict[str, Any]) -> bool:\n        op = ast_node.get(\"op\", \"\").upper()\n\n        if op == \"\
  AND\":\n            return self.evaluate_ast(ast_node[\"left\"], row) and self.evaluate_ast(ast_node[\"right\"], row)\n\
  \        if op == \"OR\":\n            return self.evaluate_ast(ast_node[\"left\"], row) or self.evaluate_ast(ast_node[\"\
  right\"], row)\n        if op == \"NOT\":\n            return not self.evaluate_ast(ast_node[\"expr\"], row)\n\n       \
  \ field = ast_node[\"field\"]\n        val = row.get(field)\n        target = ast_node[\"val\"]\n\n        if op == \"=\"\
  :\n            return val == target\n        if op == \"!=\":\n            return val != target\n\n        if val is None:\n\
  \            return False\n\n        if op == \">\":\n            return val > target\n        if op == \"<\":\n       \
  \     return val < target\n        if op == \">=\":\n            return val >= target\n        if op == \"<=\":\n      \
  \      return val <= target\n        if op == \"IN\":\n            return val in target\n        if op == \"LIKE\":\n  \
  \          parts = [re.escape(part) for part in str(target).split(\"%\")]\n            pattern = \"^\" + \".*\".join(parts)\
  \ + \"$\"\n            return bool(re.match(pattern, str(val)))\n\n        raise ValueError(f\"Unknown operator: {op}\"\
  )\n\n    def _tokenize(self, expr_str: str) -> list[str]:\n        token_spec = [\n            (\"STRING\", r\"'[^']*'\"\
  ),\n            (\"OP\", r\"!=|>=|<=|=|>|<\"),\n            (\"LPAREN\", r\"\\(\"),\n            (\"RPAREN\", r\"\\)\"),\n\
  \            (\"COMMA\", r\",\"),\n            (\"WORD\", r\"[A-Za-z_][A-Za-z0-9_]*\"),\n            (\"NUMBER\", r\"-?\\\
  d+(\\.\\d+)?\"),\n            (\"WS\", r\"\\s+\"),\n        ]\n        master_pat = \"|\".join(f\"(?P<{name}>{pat})\" for\
  \ name, pat in token_spec)\n        tokens: list[str] = []\n        for mo in re.finditer(master_pat, expr_str):\n     \
  \       kind = mo.lastgroup\n            val = mo.group()\n            if kind != \"WS\":\n                tokens.append(val)\n\
  \        return tokens\n\n    def parse_and_eval(self, expr_str: str, row: dict[str, Any]) -> bool:\n        tokens = self._tokenize(expr_str)\n\
  \        if not tokens:\n            return True\n\n        pos = 0\n\n        def peek() -> str | None:\n            nonlocal\
  \ pos\n            return tokens[pos] if pos < len(tokens) else None\n\n        def consume(expected: str | None = None)\
  \ -> str:\n            nonlocal pos\n            tok = tokens[pos]\n            pos += 1\n            return tok\n\n   \
  \     # Recursive descent parser\n        def parse_expr() -> dict[str, Any]:\n            return parse_or()\n\n       \
  \ def parse_or() -> dict[str, Any]:\n            node = parse_and()\n            while peek() and peek().upper() == \"OR\"\
  :\n                consume()\n                right = parse_and()\n                node = {\"op\": \"AND\" if False else\
  \ \"OR\", \"left\": node, \"right\": right}\n            return node\n\n        def parse_and() -> dict[str, Any]:\n   \
  \         node = parse_not()\n            while peek() and peek().upper() == \"AND\":\n                consume()\n     \
  \           right = parse_not()\n                node = {\"op\": \"AND\", \"left\": node, \"right\": right}\n          \
  \  return node\n\n        def parse_not() -> dict[str, Any]:\n            if peek() and peek().upper() == \"NOT\":\n   \
  \             consume()\n                return {\"op\": \"NOT\", \"expr\": parse_not()}\n            return parse_primary()\n\
  \n        def parse_primary() -> dict[str, Any]:\n            if peek() == \"(\":\n                consume(\"(\")\n    \
  \            node = parse_expr()\n                consume(\")\")\n                return node\n\n            field = consume()\n\
  \            op = consume().upper()\n\n            if op == \"IN\":\n                consume(\"(\")\n                items:\
  \ list[Any] = []\n                while peek() != \")\":\n                    items.append(_parse_val(consume()))\n    \
  \                if peek() == \",\":\n                        consume(\",\")\n                consume(\")\")\n         \
  \       return {\"op\": \"IN\", \"field\": field, \"val\": items}\n\n            target = _parse_val(consume())\n      \
  \      return {\"op\": op, \"field\": field, \"val\": target}\n\n        def _parse_val(tok: str) -> Any:\n            if\
  \ tok.startswith(\"'\") and tok.endswith(\"'\"):\n                return tok[1:-1]\n            try:\n                return\
  \ float(tok) if \".\" in tok else int(tok)\n            except ValueError:\n                return tok\n\n        ast_root\
  \ = parse_expr()\n        return self.evaluate_ast(ast_root, row)\n"
visible_tests: "def test_simple_equality_and_and():\n    evaluator = WhereClauseEvaluator()\n    row = {\"age\": 30, \"status\"\
  : \"active\", \"dept\": \"eng\"}\n    assert evaluator.parse_and_eval(\"age > 21 AND status = 'active'\", row) is True\n\
  \    assert evaluator.parse_and_eval(\"age < 21 AND status = 'active'\", row) is False\n\n\ndef test_or_and_parentheses_precedence():\n\
  \    evaluator = WhereClauseEvaluator()\n    row = {\"score\": 85, \"tier\": \"gold\", \"country\": \"US\"}\n    # (score\
  \ > 90 OR tier = 'gold') AND country = 'US' => True\n    assert evaluator.parse_and_eval(\"(score > 90 OR tier = 'gold')\
  \ AND country = 'US'\", row) is True\n    # score > 90 OR (tier = 'gold' AND country = 'CA') => False\n    assert evaluator.parse_and_eval(\"\
  score > 90 OR (tier = 'gold' AND country = 'CA')\", row) is False\n"
hidden_tests: "def test_not_operator():\n    evaluator = WhereClauseEvaluator()\n    row = {\"banned\": False, \"role\": \"\
  admin\"}\n    assert evaluator.parse_and_eval(\"NOT banned = 'true'\", row) is True\n    assert evaluator.parse_and_eval(\"\
  NOT role = 'admin'\", row) is False\n\n\ndef test_in_operator():\n    evaluator = WhereClauseEvaluator()\n    row = {\"\
  role\": \"editor\", \"level\": 3}\n    assert evaluator.parse_and_eval(\"role IN ('admin', 'editor', 'viewer')\", row) is\
  \ True\n    assert evaluator.parse_and_eval(\"level IN (1, 2, 4)\", row) is False\n\n\ndef test_like_operator():\n    evaluator\
  \ = WhereClauseEvaluator()\n    row = {\"email\": \"john.doe@company.org\"}\n    assert evaluator.parse_and_eval(\"email\
  \ LIKE '%.org'\", row) is True\n    assert evaluator.parse_and_eval(\"email LIKE 'john.%'\", row) is True\n    assert evaluator.parse_and_eval(\"\
  email LIKE '%.com'\", row) is False\n\n\ndef test_missing_column_evaluates_false():\n    evaluator = WhereClauseEvaluator()\n\
  \    row = {\"name\": \"Alice\"}\n    assert evaluator.parse_and_eval(\"age > 18\", row) is False\n    assert evaluator.parse_and_eval(\"\
  age != 18\", row) is True\n\n\ndef test_ast_evaluation_directly():\n    evaluator = WhereClauseEvaluator()\n    ast = {\n\
  \        \"op\": \"AND\",\n        \"left\": {\"op\": \">=\", \"field\": \"salary\", \"val\": 50000},\n        \"right\"\
  : {\"op\": \"=\", \"field\": \"department\", \"val\": \"Engineering\"},\n    }\n    assert evaluator.evaluate_ast(ast, {\"\
  salary\": 75000, \"department\": \"Engineering\"}) is True\n    assert evaluator.evaluate_ast(ast, {\"salary\": 40000, \"\
  department\": \"Engineering\"}) is False\n\n\ndef test_complex_nested_expression():\n    evaluator = WhereClauseEvaluator()\n\
  \    row = {\"x\": 10, \"y\": 20, \"z\": 30}\n    expr = \"((x = 10 AND y < 25) OR z = 99) AND NOT x > 50\"\n    assert\
  \ evaluator.parse_and_eval(expr, row) is True\n"
