canonical_solution: "import random\nfrom typing import Any\n\n\nclass _SkipNode:\n    def __init__(self, key: int, val: Any,\
  \ level: int) -> None:\n        self.key = key\n        self.val = val\n        self.forward: list['_SkipNode | None'] =\
  \ [None] * level\n\n\nclass SkipList:\n    def __init__(self, max_level: int = 16, p: float = 0.5) -> None:\n        if\
  \ max_level < 1:\n            raise ValueError(\"max_level must be >= 1\")\n        if not (0.0 < p < 1.0):\n          \
  \  raise ValueError(\"p must be between 0 and 1\")\n        self.max_level = max_level\n        self.p = p\n        self.header\
  \ = _SkipNode(-1, None, max_level)\n        self.level = 1\n        self._size = 0\n        self._rng = random.Random(1337)\n\
  \n    def _random_level(self) -> int:\n        lvl = 1\n        while self._rng.random() < self.p and lvl < self.max_level:\n\
  \            lvl += 1\n        return lvl\n\n    def search(self, key: int) -> Any | None:\n        curr = self.header\n\
  \        for i in reversed(range(self.level)):\n            while curr.forward[i] is not None and curr.forward[i].key <\
  \ key:\n                curr = curr.forward[i]\n        curr = curr.forward[0]\n        if curr is not None and curr.key\
  \ == key:\n            return curr.val\n        return None\n\n    def insert(self, key: int, val: Any = None) -> None:\n\
  \        update: list[_SkipNode] = [self.header] * self.max_level\n        curr = self.header\n\n        for i in reversed(range(self.level)):\n\
  \            while curr.forward[i] is not None and curr.forward[i].key < key:\n                curr = curr.forward[i]\n\
  \            update[i] = curr\n\n        candidate = curr.forward[0]\n        if candidate is not None and candidate.key\
  \ == key:\n            candidate.val = val\n            return\n\n        new_level = self._random_level()\n        if new_level\
  \ > self.level:\n            for i in range(self.level, new_level):\n                update[i] = self.header\n         \
  \   self.level = new_level\n\n        new_node = _SkipNode(key, val, new_level)\n        for i in range(new_level):\n  \
  \          new_node.forward[i] = update[i].forward[i]\n            update[i].forward[i] = new_node\n\n        self._size\
  \ += 1\n\n    def delete(self, key: int) -> bool:\n        update: list[_SkipNode] = [self.header] * self.max_level\n  \
  \      curr = self.header\n\n        for i in reversed(range(self.level)):\n            while curr.forward[i] is not None\
  \ and curr.forward[i].key < key:\n                curr = curr.forward[i]\n            update[i] = curr\n\n        target\
  \ = curr.forward[0]\n        if target is None or target.key != key:\n            return False\n\n        for i in range(self.level):\n\
  \            if update[i].forward[i] is not target:\n                break\n            update[i].forward[i] = target.forward[i]\n\
  \n        while self.level > 1 and self.header.forward[self.level - 1] is None:\n            self.level -= 1\n\n       \
  \ self._size -= 1\n        return True\n\n    def to_list(self) -> list[tuple[int, Any]]:\n        result: list[tuple[int,\
  \ Any]] = []\n        curr = self.header.forward[0]\n        while curr is not None:\n            result.append((curr.key,\
  \ curr.val))\n            curr = curr.forward[0]\n        return result\n\n    def __len__(self) -> int:\n        return\
  \ self._size\n"
visible_tests: "def test_skiplist_insert_and_search():\n    sl = SkipList()\n    sl.insert(10, \"ten\")\n    sl.insert(5,\
  \ \"five\")\n    sl.insert(20, \"twenty\")\n\n    assert sl.search(10) == \"ten\"\n    assert sl.search(5) == \"five\"\n\
  \    assert sl.search(99) is None\n    assert len(sl) == 3\n    assert sl.to_list() == [(5, \"five\"), (10, \"ten\"), (20,\
  \ \"twenty\")]\n\n\ndef test_skiplist_delete():\n    sl = SkipList()\n    sl.insert(1, \"one\")\n    sl.insert(2, \"two\"\
  )\n    assert sl.delete(1) is True\n    assert sl.delete(1) is False\n    assert sl.search(1) is None\n    assert len(sl)\
  \ == 1\n    assert sl.to_list() == [(2, \"two\")]\n"
hidden_tests: "def test_update_existing_key():\n    sl = SkipList()\n    sl.insert(42, \"initial\")\n    assert sl.search(42)\
  \ == \"initial\"\n    sl.insert(42, \"updated\")\n    assert sl.search(42) == \"updated\"\n    assert len(sl) == 1\n   \
  \ assert sl.to_list() == [(42, \"updated\")]\n\n\ndef test_empty_skiplist():\n    sl = SkipList()\n    assert len(sl) ==\
  \ 0\n    assert sl.search(10) is None\n    assert sl.delete(10) is False\n    assert sl.to_list() == []\n\n\ndef test_delete_head_and_tail():\n\
  \    sl = SkipList()\n    for k in [10, 20, 30, 40]:\n        sl.insert(k, k * 2)\n\n    assert sl.delete(10) is True  #\
  \ delete head\n    assert sl.delete(40) is True  # delete tail\n    assert sl.to_list() == [(20, 40), (30, 60)]\n\n\ndef\
  \ test_negative_and_zero_keys():\n    sl = SkipList()\n    keys = [-10, 0, 10, -5, 5]\n    for k in keys:\n        sl.insert(k,\
  \ f\"v_{k}\")\n    assert sl.to_list() == [(-10, \"v_-10\"), (-5, \"v_-5\"), (0, \"v_0\"), (5, \"v_5\"), (10, \"v_10\")]\n\
  \n\ndef test_scale_ordered_sequence():\n    sl = SkipList(max_level=16)\n    n = 1000\n    for i in range(n):\n        sl.insert(i,\
  \ i)\n\n    assert len(sl) == n\n    assert sl.to_list() == [(i, i) for i in range(n)]\n\n    # Delete odd numbers\n   \
  \ for i in range(1, n, 2):\n        assert sl.delete(i) is True\n\n    assert len(sl) == n // 2\n    assert sl.to_list()\
  \ == [(i, i) for i in range(0, n, 2)]\n\n\ndef test_parameter_validation():\n    import pytest\n    with pytest.raises(ValueError):\n\
  \        SkipList(max_level=0)\n    with pytest.raises(ValueError):\n        SkipList(p=1.5)\n"
