prompt: "# Probabilistic SkipList with Ordered Operations\n\nImplement a probabilistic Skip List data structure providing\
  \ $O(\\log N)$ average-case search, insertion, and deletion of key-value pairs sorted in ascending order.\n\n## Requirements\n\
  \nImplement the class `SkipList`:\n\n- `__init__(self, max_level: int = 16, p: float = 0.5)`:\n  Initializes skip list with\
  \ maximum height `max_level >= 1` and coin-flip promotion probability `p` (`0 < p < 1`).\n- `insert(self, key: int, val:\
  \ Any = None) -> None`:\n  Inserts `(key, val)`. If `key` already exists in the skip list, updates its value in place without\
  \ altering the structure or height.\n- `search(self, key: int) -> Any | None`:\n  Returns the associated value if `key`\
  \ is present, or `None` if not found.\n- `delete(self, key: int) -> bool`:\n  Removes `key` from all levels where it appears.\
  \ Returns `True` if key was found and deleted, `False` otherwise.\n- `to_list(self) -> list[tuple[int, Any]]`:\n  Returns\
  \ all elements as a sorted list of `(key, value)` tuples in ascending order.\n- `__len__(self) -> int`:\n  Returns the current\
  \ number of unique keys in the skip list.\n"
