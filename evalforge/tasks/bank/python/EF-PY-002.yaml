prompt: "# Async Token-Bucket Rate Limiter with Burst Capacity\n\nImplement an asynchronous token bucket rate limiter supporting\
  \ burst traffic and asynchronous token acquisition.\n\n## Requirements\n\nImplement the class `AsyncTokenBucket`:\n\n- `__init__(self,\
  \ rate: float, capacity: float)`:\n  Initializes limiter with a refill `rate` (tokens per second, `rate > 0`) and maximum\
  \ burst `capacity` (`capacity > 0`).\n  Initially, the bucket is completely full with `capacity` tokens.\n- `try_acquire(self,\
  \ tokens: float = 1.0) -> bool`:\n  Non-blocking attempt to acquire `tokens`.\n  If enough tokens are available, consumes\
  \ them and returns `True`.\n  Otherwise, returns `False` immediately without consuming tokens or sleeping.\n- `async acquire(self,\
  \ tokens: float = 1.0, timeout: float | None = None) -> bool`:\n  Asynchronously waits until enough tokens accumulate to\
  \ satisfy the request.\n  If acquired before `timeout` seconds expire, consumes `tokens` and returns `True`.\n  If `timeout`\
  \ is reached before tokens become available, returns `False` without consuming tokens.\n  If `timeout is None`, waits indefinitely\
  \ until tokens become available.\n- `available_tokens(self) -> float`:\n  Returns the current number of available tokens\
  \ after accounting for time elapsed since the last refill.\n- `reset(self) -> None`:\n  Resets the bucket to full capacity.\n"
