prompt: "# Maximum Flow Edmonds-Karp Algorithm\n\nImplement the Edmonds-Karp algorithm (BFS-based implementation of Ford-Fulkerson)\
  \ to compute maximum flow, edge flows, and the minimum cut in a directed capacitated network.\n\n## Requirements\n\nImplement\
  \ the class `MaxFlowNetwork`:\n\n- `__init__(self, vertices: list[Any] | None = None)`:\n  Initializes network with optional\
  \ vertex set.\n- `add_edge(self, u: Any, v: Any, capacity: float) -> None`:\n  Adds a directed capacity edge from `u` to\
  \ `v` (`capacity >= 0`).\n  If an edge already exists, adds to its existing capacity.\n- `compute_max_flow(self, source:\
  \ Any, sink: Any) -> float`:\n  Computes and returns the maximum flow achievable from `source` to `sink`.\n  Raises `ValueError`\
  \ if `source == sink` or if either vertex is not in the network.\n- `get_flow_on_edge(self, u: Any, v: Any) -> float`:\n\
  \  Returns the net flow passing through edge `u -> v` after running `compute_max_flow`.\n- `get_min_cut(self, source: Any,\
  \ sink: Any) -> tuple[set[Any], set[Any]]`:\n  Finds the minimum $s-t$ cut partition `(S, T)` where $source \\in S$ and\
  \ $sink \\in T$, such that the capacity of edges from $S$ to $T$ equals the maximum flow.\n"
