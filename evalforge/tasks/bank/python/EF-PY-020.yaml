prompt: "# Graph Cut Vertex and Bridge Detection via Tarjan's DFS\n\nImplement Tarjan's Depth-First Search algorithm to find\
  \ all articulation points (cut vertices) and bridges (cut edges) in an undirected graph.\n\n## Definitions\n\n- **Articulation\
  \ Point (Cut Vertex)**: A vertex whose removal strictly increases the number of connected components in the graph.\n- **Bridge\
  \ (Cut Edge)**: An edge whose removal strictly increases the number of connected components.\n- **Biconnected Graph**: A\
  \ connected graph with $\\ge 3$ vertices that has no articulation points.\n\n## Requirements\n\nImplement the class `TarjanBiconnected`:\n\
  \n- `__init__(self, num_vertices: int)`:\n  Initializes graph with vertices `0` through `num_vertices - 1`.\n- `add_edge(self,\
  \ u: int, v: int) -> None`:\n  Adds an undirected edge between `u` and `v` (`u != v`).\n- `find_articulation_points(self)\
  \ -> set[int]`:\n  Returns the set of vertex indices that are articulation points.\n- `find_bridges(self) -> list[tuple[int,\
  \ int]]`:\n  Returns the list of bridges formatted as canonical sorted tuples `(min(u, v), max(u, v))`, ordered lexicographically.\n\
  - `is_biconnected(self) -> bool`:\n  Returns `True` if the graph has $\\ge 3$ vertices, is fully connected, and contains\
  \ zero articulation points.\n"
