prompt: "# A* 2D Grid Pathfinding with Dynamic Obstacles\n\nImplement the A* pathfinding algorithm on a 2D integer grid supporting\
  \ dynamic obstacle placement, diagonal movement toggling, and admissible heuristic estimates.\n\n## Requirements\n\nImplement\
  \ the class `AStarGrid`:\n\n- `__init__(self, width: int, height: int, allow_diagonal: bool = False)`:\n  Initializes grid\
  \ of size `width x height` (coordinates `0 <= x < width`, `0 <= y < height`).\n  If `allow_diagonal` is `False`, allows\
  \ 4-cardinal moves (cost 1.0).\n  If `allow_diagonal` is `True`, allows 8-way moves (cardinal cost 1.0, diagonal cost $\\\
  sqrt{2} \\approx 1.4142$).\n- `set_obstacle(self, x: int, y: int, is_blocked: bool = True) -> None`:\n  Marks `(x, y)` as\
  \ an obstacle (`True`) or walkable space (`False`).\n- `is_obstacle(self, x: int, y: int) -> bool`:\n  Returns `True` if\
  \ `(x, y)` is blocked, `False` otherwise.\n- `find_path(self, start: tuple[int, int], goal: tuple[int, int]) -> list[tuple[int,\
  \ int]] | None`:\n  Finds the optimal shortest path from `start` to `goal`.\n  Returns the ordered list of coordinates `[(x0,\
  \ y0), (x1, y1), ..., (xg, yg)]` including both `start` and `goal`.\n  Returns `None` if no valid path exists or if `start`\
  \ or `goal` is blocked/out of bounds.\n  If `start == goal`, returns `[start]`.\n"
