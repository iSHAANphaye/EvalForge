prompt: "# Binary Protocol Serializer with Varint and Checksum\n\nImplement a compact binary frame serializer and deserializer\
  \ with unsigned LEB128 Varint encoding, header flags, and CRC32 checksum verification.\n\n## Frame Specification\n\n`[Magic:\
  \ 2 bytes] [MessageID: Varint] [Flags: 1 byte] [PayloadLength: Varint] [Payload: N bytes] [CRC32: 4 bytes BE]`\n\n- **Magic\
  \ bytes**: `0xEF, 0x01`\n- **MessageID**: Unsigned integer encoded via variable-length LEB128.\n- **Flags**: 1 byte (bitfield\
  \ `0..255`).\n- **PayloadLength**: Unsigned integer encoded via LEB128 representing byte length of payload.\n- **Payload**:\
  \ Raw byte buffer of length `PayloadLength`.\n- **CRC32**: 4 bytes in big-endian network order computed over `Payload`.\n\
  \n## Requirements\n\nImplement the class `BinaryProtocolCodec`:\n\n- `encode_varint(value: int) -> bytes`:\n  Encodes non-negative\
  \ integer using LEB128 (7 data bits per byte, MSB indicates continuation).\n- `decode_varint(data: bytes, offset: int =\
  \ 0) -> tuple[int, int]`:\n  Decodes integer from `data` starting at `offset`. Returns `(decoded_value, new_offset)`.\n\
  - `encode_message(msg_id: int, flags: int, payload: bytes) -> bytes`:\n  Packs message fields into compliant binary frame.\n\
  - `decode_message(frame: bytes) -> tuple[int, int, bytes]`:\n  Validates magic bytes, decodes fields, and verifies CRC32\
  \ checksum.\n  Returns `(msg_id, flags, payload)`.\n  Raises `ValueError` if magic is invalid, frame is truncated, or CRC32\
  \ checksum fails.\n"
