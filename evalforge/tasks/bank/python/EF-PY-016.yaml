prompt: "# Interval Tree with Overlap Search and Merging\n\nImplement an augmented binary search tree (Interval Tree) for\
  \ efficient 1D interval storage, overlap querying, and interval union merging.\n\n## Requirements\n\nImplement the dataclass\
  \ `Interval`:\n- `low: float`\n- `high: float`\n- `data: Any = None`\n- Two intervals `[l1, h1]` and `[l2, h2]` overlap\
  \ if `max(l1, l2) <= min(h1, h2)`.\n\nImplement the class `IntervalTree`:\n\n- `insert(self, low: float, high: float, data:\
  \ Any = None) -> None`:\n  Inserts an interval `[low, high]` into the tree (`low <= high`).\n- `search_overlaps(self, low:\
  \ float, high: float) -> list[Interval]`:\n  Finds all intervals in the tree that overlap with the query interval `[low,\
  \ high]`.\n  Returns a list of `Interval` objects sorted by `low` then `high`.\n- `delete(self, low: float, high: float)\
  \ -> bool`:\n  Removes the first interval exactly matching `[low, high]`. Returns `True` if found and deleted, `False` otherwise.\n\
  - `merge_overlapping(self) -> list[Interval]`:\n  Returns a merged list of contiguous/overlapping intervals covering the\
  \ exact same set of points, sorted by `low`.\n- `to_list(self) -> list[Interval]`:\n  Returns all stored intervals sorted\
  \ by `low` then `high`.\n"
