prompt: "# Trie with Wildcard Prefix Search\n\nImplement an efficient prefix tree (Trie) that supports exact word matching,\
  \ prefix matching, and wildcard queries where the dot character (`'.'`) matches any single character.\n\n## Requirements\n\
  \nImplement the class `WildcardTrie`:\n\n- `insert(self, word: str) -> None`:\n  Inserts `word` into the trie.\n- `search(self,\
  \ word: str) -> bool`:\n  Returns `True` if `word` exists in the trie (exact match), `False` otherwise.\n- `starts_with(self,\
  \ prefix: str) -> bool`:\n  Returns `True` if there is any word in the trie that starts with the given `prefix` (exact characters),\
  \ `False` otherwise.\n- `search_wildcard(self, pattern: str) -> list[str]`:\n  Finds all complete words in the trie matching\
  \ `pattern`, where `'.'` matches any single character.\n  The length of matching words must equal the length of `pattern`.\n\
  \  Returns a lexicographically sorted list of unique matching words.\n- `prefix_wildcard(self, pattern: str) -> list[str]`:\n\
  \  Finds all words in the trie that have a prefix matching `pattern` (where `'.'` matches any character).\n  Returns a lexicographically\
  \ sorted list of unique words.\n"
