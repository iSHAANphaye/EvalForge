prompt: "# Consistent Hashing Ring with Virtual Nodes\n\nImplement a consistent hashing ring with virtual nodes (vnodes) to\
  \ achieve uniform distribution and minimal key remapping during cluster topology changes.\n\n## Requirements\n\nImplement\
  \ the class `ConsistentHashRing`:\n\n- `__init__(self, replicas: int = 100)`:\n  Initializes the ring with `replicas` virtual\
  \ nodes per physical node (`replicas >= 1`).\n- `add_node(self, node: str) -> None`:\n  Adds a physical node to the ring.\
  \ Generates `replicas` virtual keys formatted as `f\"{node}#{i}\"` for `i` in `range(replicas)`.\n  Computes the 32-bit\
  \ integer MD5 hash of each virtual key and inserts it into the sorted ring.\n  If the node is already present, does nothing.\n\
  - `remove_node(self, node: str) -> None`:\n  Removes a physical node and all its virtual nodes from the ring.\n  If the\
  \ node does not exist, does nothing.\n- `get_node(self, key: str) -> str | None`:\n  Hashes `key` using the same MD5 hash\
  \ function, and finds the first virtual node situated clockwise (equal or greater hash) on the ring.\n  If the key's hash\
  \ exceeds all virtual node hashes, wraps around to the first virtual node.\n  Returns the physical node identifier associated\
  \ with the matched virtual node.\n  Returns `None` if the ring is empty.\n- `get_nodes(self) -> list[str]`:\n  Returns a\
  \ sorted list of unique physical nodes currently registered on the ring.\n"
