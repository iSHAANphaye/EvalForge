prompt: "# Thread-Safe LRU Cache with TTL Expiration\n\nImplement a high-performance, thread-safe Least Recently Used (LRU)\
  \ cache that supports per-item Time-To-Live (TTL) expiration.\n\n## Requirements\n\nImplement the class `ThreadSafeTTLCache`\
  \ with the following interface:\n\n- `__init__(self, capacity: int, default_ttl: float | None = None)`:\n  Initializes cache\
  \ with a maximum capacity (`capacity >= 1`) and an optional default TTL in seconds.\n- `get(self, key: Any, default: Any\
  \ = None) -> Any`:\n  Retrieves the value for `key`. If the key exists and has not expired, returns the value and updates\
  \ its LRU recency.\n  If the key does not exist or has expired, it must be removed and `default` returned.\n- `put(self,\
  \ key: Any, value: Any, ttl: float | None = None) -> None`:\n  Inserts or updates the `key` with `value` and an optional\
  \ item-specific `ttl` in seconds (overriding `default_ttl`).\n  If the key already exists, update its value and TTL and\
  \ refresh recency.\n  If capacity is reached, evict the least recently used, non-expired item.\n- `delete(self, key: Any)\
  \ -> bool`:\n  Removes the key from the cache. Returns `True` if key was present and removed, `False` otherwise.\n- `size(self)\
  \ -> int`:\n  Returns the count of non-expired keys currently in the cache.\n- `cleanup(self) -> int`:\n  Scans and purges\
  \ all expired keys from the cache. Returns the number of keys purged.\n- `clear(self) -> None`:\n  Removes all keys from\
  \ the cache.\n\n## Concurrency\nAll operations must be thread-safe using a reentrant lock (`threading.RLock`) or standard\
  \ lock (`threading.Lock`).\n"
