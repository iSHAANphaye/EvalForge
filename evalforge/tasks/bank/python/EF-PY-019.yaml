prompt: "# Monotonic Queue for Sliding Window Maximum\n\nImplement a Monotonic Queue data structure and use it to compute\
  \ the sliding window maximum of an integer array in strictly $O(N)$ linear time.\n\n## Requirements\n\nImplement the class\
  \ `MonotonicQueue`:\n- `push(self, val: int) -> None`:\n  Inserts `val`, ejecting all smaller elements from the back to\
  \ maintain non-increasing order.\n- `pop(self, val: int) -> None`:\n  Pops `val` from the front if and only if the front\
  \ element equals `val`.\n- `max(self) -> int`:\n  Returns the maximum element currently held in $O(1)$ time. Raises `IndexError`\
  \ if queue is empty.\n- `__len__(self) -> int`:\n  Returns count of elements.\n\nImplement the class `SlidingWindowMax`:\n\
  - `max_sliding_window(self, nums: list[int], k: int) -> list[int]`:\n  Returns the maximum value across all sliding windows\
  \ of size $k$.\n  - If $k \\le 0$ or `nums` is empty, returns `[]`.\n  - If $k \\ge \\text{len}(nums)$, returns `[max(nums)]`.\n\
  \  - Runs in $O(N)$ time complexity.\n"
