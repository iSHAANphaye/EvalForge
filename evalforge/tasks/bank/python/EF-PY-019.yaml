canonical_solution: "from collections import deque\n\n\nclass MonotonicQueue:\n    def __init__(self) -> None:\n        self._deque:\
  \ deque[int] = deque()\n\n    def push(self, val: int) -> None:\n        while self._deque and self._deque[-1] < val:\n\
  \            self._deque.pop()\n        self._deque.append(val)\n\n    def pop(self, val: int) -> None:\n        if self._deque\
  \ and self._deque[0] == val:\n            self._deque.popleft()\n\n    def max(self) -> int:\n        if not self._deque:\n\
  \            raise IndexError(\"Queue is empty\")\n        return self._deque[0]\n\n    def __len__(self) -> int:\n    \
  \    return len(self._deque)\n\n\nclass SlidingWindowMax:\n    def max_sliding_window(self, nums: list[int], k: int) ->\
  \ list[int]:\n        if not nums or k <= 0:\n            return []\n        if k >= len(nums):\n            return [max(nums)]\n\
  \n        mq = MonotonicQueue()\n        res: list[int] = []\n\n        for i in range(k):\n            mq.push(nums[i])\n\
  \        res.append(mq.max())\n\n        for i in range(k, len(nums)):\n            mq.pop(nums[i - k])\n            mq.push(nums[i])\n\
  \            res.append(mq.max())\n\n        return res\n"
visible_tests: "def test_sliding_window_basic():\n    sw = SlidingWindowMax()\n    nums = [1, 3, -1, -3, 5, 3, 6, 7]\n   \
  \ assert sw.max_sliding_window(nums, k=3) == [3, 3, 5, 5, 6, 7]\n\n\ndef test_monotonic_queue_operations():\n    mq = MonotonicQueue()\n\
  \    mq.push(5)\n    mq.push(2)\n    mq.push(8)\n    assert mq.max() == 8\n    mq.pop(8)\n    assert len(mq) == 0\n"
hidden_tests: "import pytest\n\n\ndef test_window_size_one():\n    sw = SlidingWindowMax()\n    nums = [4, 2, 7, 1]\n    assert\
  \ sw.max_sliding_window(nums, k=1) == [4, 2, 7, 1]\n\n\ndef test_window_size_equals_or_exceeds_length():\n    sw = SlidingWindowMax()\n\
  \    nums = [3, 1, 9, 2]\n    assert sw.max_sliding_window(nums, k=4) == [9]\n    assert sw.max_sliding_window(nums, k=10)\
  \ == [9]\n\n\ndef test_empty_or_zero_window():\n    sw = SlidingWindowMax()\n    assert sw.max_sliding_window([], k=3) ==\
  \ []\n    assert sw.max_sliding_window([1, 2], k=0) == []\n    assert sw.max_sliding_window([1, 2], k=-1) == []\n\n\ndef\
  \ test_strictly_decreasing_and_increasing():\n    sw = SlidingWindowMax()\n    assert sw.max_sliding_window([5, 4, 3, 2,\
  \ 1], k=2) == [5, 4, 3, 2]\n    assert sw.max_sliding_window([1, 2, 3, 4, 5], k=2) == [2, 3, 4, 5]\n\n\ndef test_empty_monotonic_queue_raises():\n\
  \    mq = MonotonicQueue()\n    with pytest.raises(IndexError):\n        mq.max()\n\n\ndef test_large_scale_n_10000():\n\
  \    sw = SlidingWindowMax()\n    n = 10000\n    nums = list(range(n))\n    k = 50\n    res = sw.max_sliding_window(nums,\
  \ k=k)\n    assert len(res) == n - k + 1\n    assert res[0] == k - 1\n    assert res[-1] == n - 1\n"
