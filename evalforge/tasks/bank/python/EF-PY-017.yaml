prompt: "# Work-Stealing Task Queue Simulator\n\nImplement a thread-safe Chase-Lev work-stealing thread pool task scheduler.\n\
  \n## Operational Model\n\n- Each worker thread owns a double-ended queue (deque).\n- **Worker thread**: Pushes and pops\
  \ tasks from the **bottom** of its own deque in LIFO order (cache locality).\n- **Thief threads**: When a worker has no\
  \ local tasks, it steals tasks from the **top** of other workers' deques in FIFO order (fairness).\n\n## Requirements\n\n\
  Implement the class `WorkStealingPool`:\n\n- `__init__(self, num_workers: int)`:\n  Initializes pool with `num_workers >=\
  \ 1` worker queues.\n- `submit(self, worker_id: int, task: Any) -> None`:\n  Pushes `task` to the bottom of `worker_id`'s\
  \ deque.\n- `worker_pop(self, worker_id: int) -> Any | None`:\n  Pops a task from the bottom (LIFO) of `worker_id`'s deque.\
  \ If empty, attempts to steal from any other worker.\n  Returns `task`, or `None` if all queues are empty.\n- `steal(self,\
  \ victim_id: int) -> Any | None`:\n  Steals a task from the top (FIFO) of `victim_id`'s deque. Returns `task`, or `None`\
  \ if victim's deque is empty.\n- `steal_any(self, thief_id: int) -> Any | None`:\n  Attempts to steal from other workers\
  \ in round-robin order `[(thief_id + 1) % N, (thief_id + 2) % N, ...]`.\n  Returns the first successfully stolen task, or\
  \ `None` if no tasks are available.\n- `execute_all(self) -> list[tuple[int, Any]]`:\n  Simulates execution of all pending\
  \ tasks until the entire pool is depleted.\n  Returns an ordered list of `(worker_id_who_executed, task)`.\n"
