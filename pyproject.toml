[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "AI Coding Benchmark & Rubric Grading Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "docker>=7.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[project.scripts]
evalforge = "evalforge.main:app"


[tool.hatch.build.targets.wheel]
packages = ["evalforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
